  return frame;
 });
 addEventListener('message',event=>{
  if(event.origin!==location.origin||event.data?.type!=='depth-viewer-height')return;
  const frame=frames.find(item=>item.contentWindow===event.source);
  const height=event.data.height;
  if(frame&&Number.isFinite(height)&&height>0&&height<20000){
   const nextHeight=(height+24)+'px';
   if(frame.style.height!==nextHeight)frame.style.height=nextHeight;
  }
 });
}
