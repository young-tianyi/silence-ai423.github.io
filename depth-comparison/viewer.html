<div hidden><button id="focus"></button><button id="autoRange"></button><input id="autoScale" type="checkbox" checked><select id="range"><option value="full">全帧</option><option value="object">物体</option><option value="custom">自动</option></select><input id="near" value="511"><input id="far" value="633"></div>
<div id="probe" class="readout" aria-label="像素深度读数"><div class="readout-empty">移动到图像上，查看像素深度与误差<span>点击可锁定位置</span></div></div><div class="grid" id="grid"></div>
<div class="note">四种方法的青灰细线标记有效深度与空洞的交界。NSL 使用 1 px 边缘过滤，Raw Depth 显示传感器读数，开关投影共用一帧。各深度图共享色阶。双击边缘可同步放大，点击可锁定像素读数。</div>
<script>
const W=1280,H=720,N=W*H,$=id=>document.getElementById(id);
const methods=['nsl','lingbot','da2','raw'];
const labels={ir:'原始左 IR',gt:'标定 GT',nsl:'NSL · 1 px',lingbot:'LingBot-Depth',da2:'DA2（公制深度）',raw:'Raw Depth（传感器原始深度）'};
const keys=['ir','gt',...methods];
const canvases={},sources={},data={},masks={};let scale=1,px=0,py=0,probe=null,locked=false;let rangeTimer=null,lastViewport='';
keys.forEach(k=>{const card=document.createElement('div');card.className='card';card.innerHTML='<div class="title"><b>'+labels[k]+'</b><span class="metric" id="metric-'+k+'"></span></div><div class="view"><canvas width="1280" height="720"></canvas></div>';$('grid').append(card);canvases[k]=card.querySelector('canvas');sources[k]=document.createElement('canvas');sources[k].width=W;sources[k].height=H;
let last=null;const view=card.querySelector('.view');view.onpointerdown=e=>{last=[e.clientX,e.clientY];view.setPointerCapture(e.pointerId)};view.onpointerup=()=>last=null;view.onpointercancel=()=>last=null;view.onclick=()=>{locked=!locked;showProbe()};
view.onpointermove=e=>{if(!last){if(!locked&&data.gt){const b=view.getBoundingClientRect();let x=Math.floor(((e.clientX-b.left)*W/b.width-W*(1-scale)/2-px)/scale),y=Math.floor(((e.clientY-b.top)*H/b.height-H*(1-scale)/2-py)/scale);probe=[Math.max(0,Math.min(W-1,x)),Math.max(0,Math.min(H-1,y))];showProbe();draw()}return;}px+=(e.clientX-last[0])*W/view.clientWidth;py+=(e.clientY-last[1])*H/view.clientHeight;last=[e.clientX,e.clientY];draw()};function zoomAt(e,target){
 const rect=view.getBoundingClientRect(),x=(e.clientX-rect.left)*W/rect.width-W/2,y=(e.clientY-rect.top)*H/rect.height-H/2;
 const next=Math.max(1,Math.min(24,target)),ratio=next/scale;
 px=x-(x-px)*ratio;py=y-(y-py)*ratio;scale=next;$('zoom').value=next;draw();
}
view.onwheel=e=>{e.preventDefault();zoomAt(e,scale*(e.deltaY<0?1.12:1/1.12))};
view.ondblclick=e=>{e.preventDefault();zoomAt(e,scale<8?8:Math.min(24,scale*2))};});
function draw(){
if(data.gt&&$('autoScale').checked){const signature=[scale,px,py].join(',');if(signature!==lastViewport){lastViewport=signature;clearTimeout(rangeTimer);rangeTimer=setTimeout(()=>{if($('autoScale').checked)$('autoRange').onclick()},140)}}
if(scale===1){px=0;py=0}let maxX=W*(scale-1)/2,maxY=H*(scale-1)/2;px=Math.max(-maxX,Math.min(maxX,px));py=Math.max(-maxY,Math.min(maxY,py));$('zoomValue').value=scale.toFixed(1)+'×';keys.forEach(k=>{let c=canvases[k].getContext('2d');c.imageSmoothingEnabled=false;c.clearRect(0,0,W,H);c.drawImage(sources[k],W*(1-scale)/2+px,H*(1-scale)/2+py,W*scale,H*scale);if(probe){let x=W*(1-scale)/2+px+(probe[0]+.5)*scale,y=H*(1-scale)/2+py+(probe[1]+.5)*scale;c.strokeStyle='white';c.lineWidth=1;c.beginPath();c.moveTo(x-12,y);c.lineTo(x+12,y);c.moveTo(x,y-12);c.lineTo(x,y+12);c.stroke()}})}
function edge(d,t,r){const b=new Uint8Array(N);for(let y=0;y<H;y++)for(let x=0;x<W;x++){let i=y*W+x;if(!(d[i]>0&&isFinite(d[i])))continue;for(let j of [x<W-1?i+1:-1,y<H-1?i+W:-1])if(j>=0&&d[j]>0&&isFinite(d[j])&&Math.abs(d[i]-d[j])>t){b[i]=1;b[j]=1}}if(!r)return b;const sum=new Int32Array((W+1)*(H+1)),out=new Uint8Array(N);for(let y=0;y<H;y++){let row=0;for(let x=0;x<W;x++){row+=b[y*W+x];sum[(y+1)*(W+1)+x+1]=sum[y*(W+1)+x+1]+row}}for(let y=0;y<H;y++)for(let x=0;x<W;x++){let a=Math.max(0,x-r),b=Math.min(W,x+r+1),c=Math.max(0,y-r),d=Math.min(H,y+r+1);out[y*W+x]=sum[d*(W+1)+b]-sum[c*(W+1)+b]-sum[d*(W+1)+a]+sum[c*(W+1)+a]>0}return out}
const colors=[[45,25,110],[45,116,180],[37,168,132],[239,216,74],[234,92,35]];
let irBackground;
function render(){const object=$('range').value==='object',lo=$('range').value==='custom'?Number($('near').value):(object?511:450),hi=$('range').value==='custom'?Number($('far').value):(object?633:2600);if(!(hi>lo))return;
const overlay=$('depthDisplay').value==='overlay' && irBackground;
for(const k of ['gt',...methods]){const d=data[k],mask=k==='gt'?null:masks[k],im=new ImageData(W,H),line=outlines[k];let total=0,count=0,error=0;
for(let i=0;i<N;i++){let valid=isFinite(d[i])&&d[i]>0,drop=mask&&mask[i];let rgb;if(valid&&!drop){let u=Math.max(0,Math.min(3.99999,(d[i]-lo)/(hi-lo)*4)),j=Math.floor(u),f=u-j;rgb=colors[j].map((v,a)=>v*(1-f)+colors[j+1][a]*f)}else if(line&&line[i]){rgb=edgeColor}else if(overlay){
    const gray=irBackground[i];rgb=[gray,gray,gray];
   }else{rgb=[24,36,48]}
   im.data.set([...rgb,255],i*4);if(k!=='gt'&&data.gt[i]>0&&isFinite(data.gt[i])){total++;if(valid&&!drop){count++;error+=Math.abs(d[i]-data.gt[i])}}}sources[k].getContext('2d').putImageData(im,0,0);if(k!=='gt')$('metric-'+k).innerHTML='<span class="stat" title="在有 GT 且保留有效预测的像素上计算，越小越好"><span class="stat-label">平均绝对误差（MAE）</span><strong>'+(count?(error/count).toFixed(2):'—')+' <small>mm</small></strong></span><span class="stat" title="有效 GT 像素中，保留有效预测的比例"><span class="stat-label">有效深度覆盖率</span><strong>'+(total?(100*count/total).toFixed(2):'—')+'<small>%</small></strong></span>'}showProbe();draw()}
let baseNslMask;
const outlines={};
const edgeColor=[140,185,180];
function outline(depth,mask){
 const valid=new Uint8Array(N),line=new Uint8Array(N);
 for(let i=0;i<N;i++)valid[i]=!mask?.[i]&&Number.isFinite(depth[i])&&depth[i]>0;
 for(let i=0;i<N;i++){
  if(valid[i])continue;
  const x=i%W;
  line[i]=(x>0&&valid[i-1])||(x+1<W&&valid[i+1])||(i>=W&&valid[i-W])||(i+W<N&&valid[i+W]);
 }
 return line;
}
// Opening the valid region trims protrusions without assigning depth to holes.
function openContour(valid,radius){
 let src=valid.slice(),dst=new Uint8Array(N);
 for(const erode of [true,false]){
  for(let pass=0;pass<radius;pass++){
   // Alternating cross and square footprints approximate an octagon.
   const square=(erode?pass:radius-1-pass)%2===1;
   for(let y=0;y<H;y++){
    const top=Math.max(0,y-1)*W, row=y*W, bottom=Math.min(H-1,y+1)*W;
    for(let x=0;x<W;x++){
     const i=row+x;
     if(src[i]!==Number(erode)){dst[i]=src[i];continue}
     const l=Math.max(0,x-1),r=Math.min(W-1,x+1);
     const sum=src[top+x]+src[bottom+x]+src[row+l]+src[row+r]+
       (square?src[top+l]+src[top+r]+src[bottom+l]+src[bottom+r]:0);
     dst[i]=erode?sum===(square?8:4):sum>0;
    }
   }
   [src,dst]=[dst,src];
  }
 }
 return src;
}
function smoothNslMask(base,strength){
 const valid=new Uint8Array(N), result=base.slice();
 for(let i=0;i<N;i++)valid[i]=!base[i] && Number.isFinite(data.nsl[i]) && data.nsl[i]>0;
 for(let y=0;y<H;y++){
  const above=Math.max(0,y-1)*W, row=y*W, below=Math.min(H-1,y+1)*W;
  for(let x=0;x<W;x++){
   if(!valid[row+x])continue;
   const left=Math.max(0,x-1), right=Math.min(W-1,x+1);
   const count=valid[above+left]+valid[above+x]+valid[above+right]
              +valid[row+left]+valid[row+x]+valid[row+right]
              +valid[below+left]+valid[below+x]+valid[below+right];
   if(count<5)result[row+x]=1;
  }
 }
 if(strength>1){
  for(let i=0;i<N;i++)valid[i]=valid[i]&&!result[i];
  const opened=openContour(valid,strength);
  for(let i=0;i<N;i++)if(valid[i]&&!opened[i])result[i]=1;
 }
 return result;
}
function applyNslSmoothing(){
 const strength=Number($('smoothEdges').value);
 masks.nsl=strength?smoothNslMask(baseNslMask,strength):baseNslMask;
 outlines.nsl=outline(data.nsl,masks.nsl);
 render();
}
function update(){
 baseNslMask=edge(data.nsl,100,1);
 for(const key of ['lingbot','da2'])masks[key]=edge(data[key],100,2);
 for(const key of ['lingbot','da2','raw'])outlines[key]=outline(data[key],masks[key]);
 applyNslSmoothing();
}
$('smoothEdges').onchange=()=>{if(data.nsl)applyNslSmoothing()};
$('zoom').oninput=()=>{scale=Number($('zoom').value);draw()};$('reset').onclick=()=>{scale=1;px=py=0;$('zoom').value=1;draw()};

function showProbe(){
 if(!probe||!data.gt)return;
 const i=probe[1]*W+probe[0],gt=data.gt[i];
 const valid=v=>Number.isFinite(v)&&v>0;
 const value=v=>valid(v)?v.toFixed(2)+'<span class="readout-unit">mm</span>':'<span style="font-size:15px;color:#aaa298">无有效深度</span>';
 const cell=(label,body,foot,model=false)=>'<div class="readout-cell'+(model?' model':'')+'"><div class="readout-label">'+(model?'<i class="readout-dot"></i>':'')+label+'</div><div class="readout-value">'+body+'</div><div class="readout-bottom">'+foot+'</div></div>';
 let html=cell('像素位置',probe[0]+'<span class="readout-unit">x</span> <span style="color:#ddd5ca">/</span> '+probe[1]+'<span class="readout-unit">y</span>',locked?'已锁定 · 点击解锁':'实时跟随 · 点击锁定');
 html+=cell('标定 GT',value(gt),'参考深度');
 for(const k of methods){
  const d=masks[k]?.[i]?NaN:data[k][i];
  let foot='';
  if(valid(gt)&&valid(d)){
   const error=d-gt,kind=error<0?'near':'far',direction=Math.abs(error)<.005?'一致':error<0?'偏近':'偏远';
   foot='<span class="error-pill '+kind+'">'+(error>0?'+':'')+error.toFixed(2)+' mm</span><span>'+direction+'</span>';
  } else if(!foot)foot='缺少有效参考，无法计算误差';
  html+=cell(labels[k],value(d),foot,true);
 }
 $('probe').innerHTML=html;
}
$('focus').onclick=()=>{scale=4;px=(640-535)*scale;py=(360-380)*scale;$('zoom').value=scale;$('range').value='object';render()};
$('autoRange').onclick=()=>{
 const source=$('colorSource').value,depth=data[source];if(!depth)return;
 const values=[];
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const sx=W*(1-scale)/2+px+x*scale,sy=H*(1-scale)/2+py+y*scale,v=depth[y*W+x];
  if(sx>=0&&sx<W&&sy>=0&&sy<H&&v>0&&Number.isFinite(v)&&!masks[source]?.[y*W+x])values.push(v);
 }
 if(!values.length){$('status').textContent='当前视野没有有效'+(source==='gt'?' GT':' NSL 深度')+'，保留上一色阶';return}
 values.sort((a,b)=>a-b);
 const near=Math.floor(values[Math.floor(values.length*.02)]),far=Math.max(near+1,Math.ceil(values[Math.floor(values.length*.98)]));
 $('near').value=near;$('far').value=far;$('range').value='custom';$('status').textContent='';
 $('colorLegend').innerHTML='<span>'+near+' mm</span><i class="color-strip"></i><span>'+far+' mm</span>';
 render();
};
document.querySelectorAll('[data-source]').forEach(button=>button.onclick=()=>{
 $('colorSource').value=button.dataset.source;
 document.querySelectorAll('[data-source]').forEach(item=>{const selected=item===button;item.classList.toggle('selected',selected);item.setAttribute('aria-pressed',String(selected))});
 $('colorSource').onchange();
});
$('colorSource').onchange=()=>{lastViewport='';$('autoScale').checked=true;$('autoRange').onclick()};
$('autoScale').onchange=()=>{lastViewport='';if($('autoScale').checked)$('autoRange').onclick()};
for(let id of ['near','far'])$(id).onchange=()=>{$('autoScale').checked=false;$('range').value='custom';render()};

function decodeDepth(buffer){
 if(buffer.byteLength !== N*4) throw Error('深度尺寸不符');
 const bytes=new Uint8Array(buffer), bits=new Uint32Array(N);
 for(let y=0;y<H;y++){
  let previous=0;
  for(let x=0;x<W;x++){
   const i=y*W+x;
   previous ^= bytes[i] | (bytes[N+i]<<8) | (bytes[2*N+i]<<16) | (bytes[3*N+i]<<24);
   bits[i]=previous;
  }
 }
 return new Float32Array(bits.buffer);
}
const sceneCache={};let loadSequence=0;
$('illumination').checked = new URLSearchParams(location.search).get('mode') !== 'off';
function syncSceneUrl() {
  const url = new URL(location.href);
  url.searchParams.set('scene', sceneId);
  url.searchParams.set('mode', $('illumination').checked ? 'on' : 'off');
  history.replaceState(null, '', url);
}
const scenes=["d435i-merged/000005", "d435i-merged/000003", "gemini335l/000009", "gemini335l/000004"];
const label=id=>id.replace('d435i-merged/','D435i · ').replace('gemini335l/','Gemini 335L · ');
let sceneId=new URLSearchParams(location.search).get('scene');
if(!scenes.includes(sceneId))sceneId=scenes[0];
for(const id of scenes)$('sceneSelect').add(new Option(label(id),id));
function selectScene(id){sceneId=id;$('sceneSelect').value=id;$('previous').disabled=id===scenes[0];$('next').disabled=id===scenes.at(-1);$('heading').textContent=label(id);syncSceneUrl();scale=1;px=py=0;probe=null;locked=false;$('zoom').value=1;$('probe').innerHTML='<div class="readout-empty">移动到图像上，查看像素深度与误差<span>点击可锁定位置</span></div>';loadScene($('illumination').checked?'on':'off')}
$('sceneSelect').onchange=()=>selectScene($('sceneSelect').value);
$('previous').onclick=()=>selectScene(scenes[scenes.indexOf(sceneId)-1]);
$('next').onclick=()=>selectScene(scenes[scenes.indexOf(sceneId)+1]);

async function loadScene(mode){
 const sequence=++loadSequence;const id=sceneId,key=id+'-'+mode;
 $('status').textContent='正在切换…';
 const suffix=mode==='off'?'-off':'';
 try{
  if(!sceneCache[key]){
   const entries=await Promise.all(['gt','nsl','raw','lingbot','da2'].map(async k=>{
    const file='pixels/'+id+'/'+(['raw','gt'].includes(k)?k:k+'-'+mode)+'.bin.gz';
    const response=await fetch(file);
    if(!response.ok)throw Error('载入失败');
    const unpacked=response.body.pipeThrough(new DecompressionStream('gzip'));const buffer=await new Response(unpacked).arrayBuffer();
    const values=k==='raw'?new Uint16Array(buffer):decodeDepth(buffer);
    if(values.length!==N)throw Error('深度尺寸不符');
    return [k,values];
   }));
   const image=new Image();image.src='pixels/'+id+'/ir-'+mode+'.png';await image.decode();
   sceneCache[key]={depth:Object.fromEntries(entries),image};for(const old of Object.keys(sceneCache))if(old!==key&&Object.keys(sceneCache).length>3)delete sceneCache[old];
  }
  if(sequence!==loadSequence)return;
  Object.assign(data,sceneCache[key].depth);
  const irContext=sources.ir.getContext('2d');
  irContext.drawImage(sceneCache[key].image,0,0,W,H);
  const pixels=irContext.getImageData(0,0,W,H).data;
  irBackground=new Uint8Array(N);
  for(let i=0;i<N;i++)irBackground[i]=45+0.6*pixels[4*i];
  lastViewport='';
  $('sceneSubtitle').textContent=(mode==='on'?'开投影':'关投影')+' / 1280 × 720 / 多图同步缩放与平移';
  $('status').textContent='';
  update();
 }catch(error){if(sequence===loadSequence)$('status').textContent=error.message}
}
$('depthDisplay').onchange=()=>{if(data.gt)render()};
$('illumination').onchange=()=>{syncSceneUrl();loadScene($('illumination').checked?'on':'off')};
$('range').onchange=()=>{$('autoScale').checked=false;if(data.gt)render()};
selectScene(sceneId);
</script></html>
